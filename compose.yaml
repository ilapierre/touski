services:
  db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - '3307:3306'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: python_backend
    ports:
      - '5000:5000'
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_ROOT_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      - db

  frontend:
    image: node:20-alpine
    container_name: react_frontend
    working_dir: /app
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

volumes:
  mysql_data: